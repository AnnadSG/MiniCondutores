<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MiniCondutores – Regras da Estrada Kids</title>
<style>
:root{
  --navy:#17324d; --teal:#0f8a8a; --teal-l:#e6f4f4; --sky:#dff1ff; --sun:#ffc93c; --coral:#ff6b5b;
  --green:#2fb67c; --ink:#17324d; --muted:#5d7287; --card:#fff; --bg:#f2f8fb;
  --red:#d8232a; --blue:#1d5fb4;
  --radius:22px;
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding:14px 14px 96px;position:relative}
h1,h2,h3{margin:.2em 0;line-height:1.15}
h1{font-size:30px;font-weight:900}
h2{font-size:24px;font-weight:900}
h3{font-size:18px;font-weight:800}
p{line-height:1.45}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 4px 0 rgba(23,50,77,.08),0 8px 24px rgba(23,50,77,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:18px;font-weight:800;font-size:18px;background:var(--teal);color:#fff;box-shadow:0 5px 0 #0a6464;transition:transform .08s, box-shadow .08s;user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0a6464}
.btn.big{font-size:22px;padding:18px 26px;border-radius:22px}
.btn.sun{background:var(--sun);color:var(--navy);box-shadow:0 5px 0 #d29b13}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 #c94436}
.btn.navy{background:var(--navy);box-shadow:0 5px 0 #0a1c2c}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 5px 0 #c8d6e0}
.btn.small{font-size:15px;padding:9px 14px;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:46px;height:46px;border-radius:14px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 0 #c8d6e0}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;box-shadow:0 3px 0 #c8d6e0;font-size:16px}
.avatar{width:54px;height:54px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:32px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.avatar.lg{width:96px;height:96px;font-size:58px}
.brand{font-weight:900;font-size:28px;letter-spacing:-.5px}
.brand span{color:var(--teal)}
.hero{background:linear-gradient(180deg,#bfe6ff 0%,#dff4ff 60%,#c9ecc9 60%,#b4e3b4 100%);border-radius:28px;padding:18px;position:relative;overflow:hidden;min-height:170px}
.hero .road{position:absolute;left:0;right:0;bottom:22px;height:40px;background:#55606b}
.hero .road:after{content:"";position:absolute;left:0;right:0;top:18px;height:4px;background:repeating-linear-gradient(90deg,#fff 0 26px,transparent 26px 50px);animation:dash 1.2s linear infinite}
@keyframes dash{to{background-position:-50px 0}}
.hero .drive{position:absolute;bottom:34px;font-size:40px;animation:drive 9s linear infinite}
@keyframes drive{from{left:-60px}to{left:110%}}
.hero .cloud{position:absolute;font-size:34px;opacity:.9;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:480px){.g4{grid-template-columns:repeat(3,1fr)}}
.profile-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:22px;background:#fff;box-shadow:0 5px 0 #c8d6e0;font-weight:800;font-size:18px}
.profile-tile:active{transform:translateY(3px);box-shadow:0 2px 0 #c8d6e0}
.choice{border-radius:16px;background:#fff;box-shadow:0 4px 0 #c8d6e0;padding:10px;font-size:30px;display:flex;align-items:center;justify-content:center;min-height:58px;border:3px solid transparent}
.choice.sel{border-color:var(--teal);background:var(--teal-l)}
input[type=text]{width:100%;font:inherit;font-size:22px;font-weight:800;padding:14px 16px;border-radius:16px;border:3px solid #cfe0ea;outline:none;color:var(--navy)}
input[type=text]:focus{border-color:var(--teal)}
.level{display:flex;align-items:center;gap:14px;padding:14px;border-radius:24px;background:#fff;box-shadow:0 5px 0 #c8d6e0;text-align:left;width:100%;position:relative}
.level .bubble{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.level.locked{opacity:.55;filter:grayscale(.7)}
.level .lock{position:absolute;right:14px;top:12px;font-size:22px}
.stars{color:#f5b301;font-size:18px;letter-spacing:1px}
.stars .off{color:#d5dde3}
.progress{height:12px;background:#e3edf2;border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7ed957);border-radius:99px}
.path{display:flex;flex-direction:column;gap:14px;position:relative}
.game-tile{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:#fff;box-shadow:0 5px 0 #c8d6e0;text-align:left;width:100%}
.game-tile .ic{font-size:34px;width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--teal-l);flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -4px 20px rgba(23,50,77,.1);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:760px;width:100%}
.nav button{flex:1;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.nav button b{font-size:26px;line-height:1.2}
.nav button.on{color:var(--teal)}
.qcard{background:#fff;border-radius:26px;padding:18px;box-shadow:0 5px 0 #c8d6e0}
.qtext{font-size:22px;font-weight:900;line-height:1.3}
.opts{display:grid;gap:12px;margin-top:14px}
.opt{background:#fff;border-radius:20px;padding:14px 16px;font-size:19px;font-weight:800;box-shadow:0 5px 0 #c8d6e0;border:3px solid #e3edf2;text-align:left;display:flex;align-items:center;gap:12px;min-height:64px}
.opt.vis{justify-content:center;text-align:center;flex-direction:column}
.opt:active{transform:translateY(3px)}
.opt.ok{border-color:var(--green);background:#e5f8ee;box-shadow:0 5px 0 #8fd3b0}
.opt.no{border-color:var(--coral);background:#ffeceA;box-shadow:0 5px 0 #f3b2aa}
.opt.dim{opacity:.5}
.feedback{margin-top:14px;border-radius:20px;padding:14px 16px;font-size:18px;font-weight:700;line-height:1.4}
.feedback.ok{background:#e5f8ee;color:#16683f}
.feedback.no{background:#fff3d6;color:#7a5200}
.scene-emoji{font-size:56px;text-align:center;letter-spacing:6px;margin:6px 0 10px}
.dot{display:inline-block;width:54px;height:54px;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .progress{flex:1}
.signbox{display:flex;justify-content:center;margin:6px 0 4px}
.signbox svg{filter:drop-shadow(0 4px 4px rgba(0,0,0,.18))}
/* road scene */
.roadscene{position:relative;height:230px;border-radius:24px;overflow:hidden;background:#8fd18f;margin-bottom:12px}
.roadscene .asphalt{position:absolute;left:28%;right:28%;top:0;bottom:0;background:#56616c}
.roadscene .lane{position:absolute;left:50%;top:-60px;bottom:0;width:8px;margin-left:-4px;background:repeating-linear-gradient(180deg,#fff 0 30px,transparent 30px 60px);animation:lane .8s linear infinite}
.roadscene.stop .lane,.roadscene.stop .tree{animation-play-state:paused}
@keyframes lane{to{transform:translateY(60px)}}
.roadscene .veh{position:absolute;left:50%;bottom:14px;transform:translateX(-10%);font-size:54px;transition:bottom 1.2s ease-in}
.roadscene .veh.go{bottom:260px}
.roadscene .rsign{position:absolute;right:4%;top:10px;animation:approach 1.6s ease-out forwards;transform-origin:center bottom}
.roadscene .rsign .pole{width:6px;height:40px;background:#888;margin:0 auto}
@keyframes approach{from{transform:scale(.25) translateY(-80px);opacity:.2}to{transform:scale(1) translateY(0);opacity:1}}
.roadscene .tree{position:absolute;left:6%;font-size:34px;animation:trees 2.4s linear infinite}
@keyframes trees{from{top:-50px}to{top:240px}}
/* crossing */
.cross{position:relative;height:330px;border-radius:24px;overflow:hidden;background:#cfd8dc;user-select:none}
.cross .walk{position:absolute;left:0;right:0;height:70px;background:#d9cbb5;background-image:linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px);background-size:30px 30px}
.cross .walk.t{top:0}.cross .walk.b{bottom:0}
.cross .street{position:absolute;left:0;right:0;top:70px;bottom:70px;background:#4f5a64}
.cross .zebra{position:absolute;left:38%;width:24%;top:0;bottom:0;background:repeating-linear-gradient(180deg,#fff 0 16px,transparent 16px 32px);opacity:.95}
.cross .kid{position:absolute;left:50%;bottom:12px;font-size:46px;transform:translateX(-50%);transition:bottom 1.6s ease-in-out}
.cross .kid.up{bottom:268px}
.cross .kid.look{animation:look 1s ease-in-out}
@keyframes look{0%,100%{transform:translateX(-50%) scaleX(1)}25%{transform:translateX(-50%) scaleX(-1)}50%{transform:translateX(-50%) scaleX(1)}75%{transform:translateX(-50%) scaleX(-1)}}
.cross .car{position:absolute;font-size:50px;top:108px;left:110%;animation:carx 1.7s linear forwards}
.cross .car.b{top:150px}
@keyframes carx{to{left:-25%}}
.cross .light{position:absolute;right:10px;top:8px;z-index:3;background:#1d2329;border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.cross .light span{width:42px;height:42px;font-size:22px;border-radius:10px;background:#333b42;display:flex;align-items:center;justify-content:center}
.cross .light span.r.on{background:#ff3b30;box-shadow:0 0 18px #ff3b30}
.cross .light span.g.on{background:#2fe06b;box-shadow:0 0 18px #2fe06b}
.cross .light span.g.blink{animation:blink .4s steps(2) infinite}
@keyframes blink{50%{background:#333b42;box-shadow:none}}
/* memory */
.mem{display:grid;gap:10px}
.mcard{aspect-ratio:3/4;perspective:600px}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-weight:800;font-size:14px;line-height:1.15}
.mcard .f{background:linear-gradient(135deg,var(--teal),#13a7a7);color:#fff;font-size:32px;box-shadow:0 4px 0 #0a6464}
.mcard .b{background:#fff;transform:rotateY(180deg);box-shadow:0 4px 0 #c8d6e0;border:3px solid #e3edf2}
.mcard.done .b{border-color:var(--green);background:#eefaf3}
/* build */
.steps{display:flex;gap:6px;justify-content:center;margin:8px 0}
.steps i{width:30px;height:8px;border-radius:9px;background:#d5e2ea}
.steps i.on{background:var(--teal)}
.timer{height:14px;border-radius:9px;background:#e3edf2;overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));transform-origin:left;}
/* modal */
.modal{position:fixed;inset:0;background:rgba(23,50,77,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px;animation:fade .2s}
.modal .box{background:#fff;border-radius:28px;padding:22px;max-width:460px;width:100%;max-height:90vh;overflow:auto;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.bigstars{font-size:54px;letter-spacing:4px}
.bigstars span{display:inline-block;color:#d5dde3}
.bigstars span.on{color:#f5b301;animation:starpop .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.sticker{aspect-ratio:1;border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;box-shadow:0 4px 0 #c8d6e0;position:relative}
.sticker small{font-size:11px;font-weight:800;color:var(--muted);margin-top:2px;text-align:center;padding:0 4px}
.sticker.locked{background:#e8eff3;box-shadow:none;border:3px dashed #c3d3dc}
.sticker.locked span{filter:grayscale(1) brightness(0);opacity:.12}
.sticker.new{animation:wiggle .8s ease-in-out 2}
@keyframes wiggle{25%{transform:rotate(-8deg) scale(1.08)}75%{transform:rotate(8deg) scale(1.08)}}
.reveal{font-size:110px;animation:reveal 1s cubic-bezier(.2,1.6,.4,1)}
@keyframes reveal{from{transform:scale(0) rotate(-200deg)}}
.diploma{border:8px double var(--teal);border-radius:20px;padding:18px;background:linear-gradient(180deg,#fffef6,#fff6dc);text-align:center}
.diploma .seal{font-size:60px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 14px;border-radius:999px;background:#fff;font-weight:800;box-shadow:0 3px 0 #c8d6e0;font-size:15px}
.tab.on{background:var(--navy);color:#fff;box-shadow:0 3px 0 #0a1c2c}
.libitem{background:#fff;border-radius:20px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 #c8d6e0;font-weight:800;font-size:13px;text-align:center;line-height:1.15}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:60;animation:pop .3s;max-width:90%;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.switch{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e8eff3;font-weight:800;font-size:17px}
.tog{width:58px;height:34px;border-radius:99px;background:#cfdce4;position:relative;transition:.2s;flex:none}
.tog:after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tog.on{background:var(--green)}
.tog.on:after{left:28px}
input[type=range]{width:100%;accent-color:var(--teal);height:30px}
.shop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:#fff;border-radius:20px;box-shadow:0 4px 0 #c8d6e0;border:3px solid transparent}
.shop.sel{border-color:var(--teal);background:var(--teal-l)}
.shop .e{font-size:44px}
.bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:700}
.bar-row .progress{flex:1}
.voicewarn{background:#fff3d6;color:#7a5200;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;margin-top:8px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bounce{animation:bounce .6s}
@keyframes bounce{40%{transform:scale(1.15)}}
.sayb{width:44px;height:44px;border-radius:50%;background:var(--sun);display:inline-flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 0 #d29b13;flex:none}
</style>

<body>
<div id="app"></div>
<div id="layer"></div>
<script>
"use strict";
/* =========================================================
   MiniCondutores – jogo educativo de regras e sinais da estrada (PT)
   ========================================================= */

/* ---------- Utilitários ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const uid = () => Math.random().toString(36).slice(2,9);

/* ---------- Armazenamento (perfis) ---------- */
const Store = {
  key: 'minicondutores_v1', mem: null,
  load(){ try { const r = localStorage.getItem(this.key); if (r) return JSON.parse(r); } catch(e){} return this.mem; },
  save(d){ this.mem = JSON.parse(JSON.stringify(d)); try { localStorage.setItem(this.key, JSON.stringify(d)); } catch(e){} }
};
const S = Store.load() || { profiles: [], current: null, settings: { sound:true, music:false, voice:true, volume:0.8 } };
if (!S.settings) S.settings = { sound:true, music:false, voice:true, volume:0.8 };
const save = () => Store.save(S);
const P = () => S.profiles.find(p => p.id === S.current) || null;

/* =========================================================
   SOM – Web Audio (sintetizado, sem ficheiros externos)
   ========================================================= */
const SFX = (() => {
  const noiseCache = new WeakMap();
  function noiseBuf(c){
    if (noiseCache.has(c)) return noiseCache.get(c);
    const b = c.createBuffer(1, Math.floor(c.sampleRate*1.5), c.sampleRate);
    const d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    noiseCache.set(c, b); return b;
  }
  function tone(c, out, t, o){
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.slide || o.dur));
    const v = o.vol == null ? 0.3 : o.vol, a = o.attack || 0.01, d = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(out);
    if (o.vib){ const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibAmt || 30; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t+d+0.05); }
    osc.start(t); osc.stop(t + d + 0.05);
    return osc;
  }
  function noise(c, out, t, o){
    const s = c.createBufferSource(); s.buffer = noiseBuf(c);
    const f = c.createBiquadFilter(); f.type = o.ftype || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + o.dur);
    const g = c.createGain(); const v = o.vol == null ? 0.3 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.02));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t); s.stop(t + o.dur + 0.05);
  }
  const N = { C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880, B5:987.77, C6:1046.5, E6:1318.5, G6:1568, C4:261.63, E4:329.63, G4:392, A4:440 };
  return {
    click:(c,o,t)=>{ tone(c,o,t,{type:'triangle',f:900,f2:600,dur:.07,vol:.18}); },
    flip:(c,o,t)=>{ noise(c,o,t,{f:2500,f2:900,dur:.12,vol:.25,q:2}); tone(c,o,t,{type:'sine',f:500,f2:800,dur:.1,vol:.08}); },
    correct:(c,o,t)=>{ [N.C5,N.E5,N.G5,N.C6].forEach((f,i)=>tone(c,o,t+i*.08,{type:'triangle',f,dur:.25,vol:.28})); tone(c,o,t+.32,{type:'sine',f:N.E6,dur:.4,vol:.12}); },
    wrong:(c,o,t)=>{ tone(c,o,t,{type:'sine',f:420,f2:300,dur:.22,vol:.25}); tone(c,o,t+.2,{type:'sine',f:330,f2:240,dur:.3,vol:.22}); },

const Sound = (() => {
  let ctx = null, master = null, musicGain = null, musicTimer = null, mi = 0, nextT = 0;
  function ensure(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx){
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = S.settings.volume * 1.7;
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
      master.connect(comp); comp.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = 0.16; musicGain.connect(master);
    }
    if (ctx.state === 'suspended' || ctx.state === 'interrupted') { ctx.resume().catch(()=>{}); }
    return ctx;
  }
  function unlock(){
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
    const c = ensure(); if (!c) return;
    try { const b = c.createBuffer(1, 1, 22050); const s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch(e){}
    if (S.settings.music) startMusic();
  }
  function play(name){
    if (!S.settings.sound) return;
    const c = ensure(); if (!c || !SFX[name]) return;
    try { SFX[name](c, master, c.currentTime + 0.02); } catch(e){ console.warn(e); }
  }
  function setVolume(v){ S.settings.volume = v; if (master) master.gain.setTargetAtTime(v * 1.7, ctx.currentTime, 0.05); }
  const MEL = ['G5','E5','G5','A5','G5','E5','C5',0,'D5','E5','G5','E5','D5','C5','D5',0,'G5','E5','G5','A5','C6','A5','G5',0,'E5','D5','C5','D5','C5',0,0,0];
  const BASS = ['C4','C4','A4','A4','E4','E4','G4','G4'];
  function startMusic(){
    const c = ensure(); if (!c || musicTimer) return;
    nextT = c.currentTime + 0.1; mi = 0;
    musicTimer = setInterval(() => {
      while (nextT < c.currentTime + 0.35){
        const n = MEL[mi % MEL.length];
        if (n) SFX._tone(c, musicGain, nextT, {type:'triangle', f:SFX._N[n], dur:.24, vol:.5});
        if (mi % 4 === 0) SFX._tone(c, musicGain, nextT, {type:'sine', f:SFX._N[BASS[(mi/4)%BASS.length]]/2, dur:.9, vol:.6});
        nextT += 0.26; mi++;
      }
    }, 90);
  }
  function stopMusic(){ if (musicTimer){ clearInterval(musicTimer); musicTimer = null; } }
  return { ensure, unlock, play, setVolume, startMusic, stopMusic, get ctx(){ return ctx; }, get master(){ return master; } };
})();

/* ---------- Voz (narração PT-PT) ---------- */
const Voice = {
  voice: null, langFound: null,
  pick(){
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    this.voice = vs.find(v => /pt[-_]PT/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
    this.langFound = this.voice ? this.voice.lang : null;
  },
  say(text){
    if (!S.settings.voice || !('speechSynthesis' in window) || !text) return;
    const clean = String(text).replace(/<[^>]+>/g,' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/km\/h/g,'quilómetros por hora').trim();
    if (!clean) return;
    try {
      speechSynthesis.cancel();
      setTimeout(() => {
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = 'pt-PT'; if (this.voice) u.voice = this.voice;
        u.rate = 0.95; u.pitch = 1.1; u.volume = Math.min(1, S.settings.volume + 0.2);
        speechSynthesis.speak(u);
      }, 80);
    } catch(e){}
  },
  stop(){ try { speechSynthesis.cancel(); } catch(e){} }
};
if ('speechSynthesis' in window){ Voice.pick(); speechSynthesis.onvoiceschanged = () => Voice.pick(); }

function carRear(x, y, c){
  return `<g fill="${c}"><path d="M${x+5} ${y+12} L${x+9} ${y} H${x+25} L${x+29} ${y+12} Z"/><rect x="${x}" y="${y+11}" width="34" height="16" rx="4"/><rect x="${x+2}" y="${y+26}" width="7" height="8" rx="2"/><rect x="${x+25}" y="${y+26}" width="7" height="8" rx="2"/></g><rect x="${x+11}" y="${y+3}" width="12" height="7" fill="#fff" opacity=".9"/>`;

function rotundaArrows(c){
  let s = '';
  for (let k=0;k<3;k++){
    const a1 = (k*120 + 100) * Math.PI/180, a2 = a1 + 70*Math.PI/180, r = 25;
    const p = a => [50 + r*Math.cos(a), 50 - r*Math.sin(a)];
    const [x1,y1] = p(a1), [x2,y2] = p(a2);

    s += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 0 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${c}" stroke-width="8"/>`;

function drawShape(shape, scheme, sym, size){
  const sc = SCHEMES[scheme] || SCHEMES.blank; let body = '', tr = '';
  switch(shape){
    case 'tri':
      body = `<polygon points="50,7 95,89 5,89" fill="${sc.border||sc.fill}" stroke="${sc.border||sc.fill}" stroke-width="7" stroke-linejoin="round"/><polygon points="50,25 81,81 19,81" fill="${sc.fill}"/>`;
      tr = 'translate(50,62) scale(0.43) translate(-50,-50)'; break;
    case 'triDown':
      body = `<polygon points="5,11 95,11 50,93" fill="${sc.border||sc.fill}" stroke="${sc.border||sc.fill}" stroke-width="7" stroke-linejoin="round"/><polygon points="21,20 79,20 50,73" fill="${sc.fill}"/>`;
      tr = 'translate(50,38) scale(0.35) translate(-50,-50)'; break;
    case 'circle':
      body = sc.ring ? `<circle cx="50" cy="50" r="47" fill="${sc.ring}"/><circle cx="50" cy="50" r="36" fill="${sc.fill}"/>` : `<circle cx="50" cy="50" r="47" fill="${sc.fill}" stroke="#fff" stroke-width="2.5"/>`;

}

function newProfile(name, avatar, color, ageLvl){
  return { id:uid(), name, avatar, color, ageLvl, coins:10, stickers:[], vehicles:['🚲'], vehicle:'🚲', progress:{}, signStats:{}, diplomas:[], unlockAll:false, plays:0, created:Date.now() };
}
const gameStars = (p, gid) => (p.progress[gid] || 0);
const levelStars = (p, L) => L.games.reduce((a,g) => a + gameStars(p, g.id), 0);
const levelDone = (p, L) => L.games.every(g => gameStars(p, g.id) > 0);
const levelUnlocked = (p, L) => p.unlockAll || L.n <= p.ageLvl || (L.n > 1 && levelDone(p, LEVELS[L.n-2]));
const totalStars = p => LEVELS.reduce((a,L) => a + levelStars(p, L), 0);
function stat(signId, ok){ const p = P(); if (!p || !signId) return; const s = p.signStats[signId] || (p.signStats[signId] = {ok:0, err:0}); ok ? s.ok++ : s.err++; }
function weightedSigns(pool, n){
  const p = P();
  const w = pool.map(s => { const st = p.signStats[s.id] || {ok:0,err:0}; return { s, w: Math.max(0.5, 1 + st.err*2 - st.ok*0.3) }; });
  const out = [];
  while (out.length < n && w.length){
    const tot = w.reduce((a,x)=>a+x.w,0); let r = Math.random()*tot, i = 0;
    for (; i<w.length; i++){ r -= w[i].w; if (r <= 0) break; }
    out.push(w.splice(Math.min(i, w.length-1),1)[0].s);
  }
  return out;
}

/* =========================================================

   ========================================================= */
function startGame(L, g){
  const ctx = { L, g };
  switch(g.type){
    case 'cross': return gameCross(ctx);
    case 'quiz': return gameQuiz(ctx, prepBank(g.bank, g.n));
    case 'signquiz': return gameQuiz(ctx, signQuestions(SIGNS.filter(s => s.lvl <= g.pool && (!g.cats || g.cats.includes(s.cat))), g.n));
    case 'detective': return gameQuiz(ctx, detectiveQs(g.bank), { detective:true });
    case 'road': return gameQuiz(ctx, prepBank(g.bank, 8), { road: g.veh || P().vehicle || '🚗' });
    case 'memory': return gameMemory(ctx);
    case 'build': return gameBuild(ctx);
    case 'flash': return gameFlash(ctx);
    case 'exam': return gameQuiz(ctx, examQs(), {});
  }
}
function hud(L, i, n, extra=''){
  return `<div class="hud"><button class="iconbtn" id="quit">✖️</button><div class="progress"><i style="width:${Math.round(i/n*100)}%;background:${L.color}"></i></div><b>${i}/${n}</b>${extra}</div>`;
}
function bindQuit(L){ $('#quit').onclick = () => { Sound.play('click'); screenLevel(L); }; }
function optHTML(o){ return typeof o === 'string' && o.trim().startsWith('<') ? o : esc(o); }
function prepBank(name, n){
  const b = shuffle(BANKS[name]).slice(0, n || BANKS[name].length);
  return b.map(x => {
    const opts = x.opts.map((o,i) => ({ html:optHTML(o), text: typeof o === 'string' && !o.trim().startsWith('<') ? o : '', ok:i===0 }));
    let visual = '';
    if (x.sign) visual = `<div class="signbox">${signSVG(x.sign, 120)}</div>`;
    else if (x.visual) visual = `<div class="signbox" style="gap:18px">${x.visual.map(v => signSVG(v, 100)).join('')}</div>`;
    else if (x.scene) visual = `<div class="scene-emoji">${x.scene}</div>`;
    const vis = opts.some(o => !o.text);
    return { q:x.q, visual, sign:x.sign, opts:shuffle(opts), exp:x.exp, vis, signId:x.sign };
  });
}
function signQuestions(pool, n){
  const chosen = weightedSigns(pool, Math.min(n, pool.length));
  return chosen.map((s, i) => {
    const others = shuffle(pool.filter(o => o.id !== s.id)).slice(0, 2);
    if (i % 2 === 0){
      return { q:'O que quer dizer este sinal?', visual:`<div class="signbox">${signSVG(s.id,130)}</div>`, opts:shuffle([s, ...others].map(o => ({ html:esc(o.find), text:o.find, ok:o.id===s.id }))), exp:`${s.name}: ${s.desc}`, signId:s.id };
    }
    return { q:`Qual é o sinal: «${s.find}»?`, visual:'', vis:true, opts:shuffle([s, ...others].map(o => ({ html:signSVG(o.id, 84), text:'', ok:o.id===s.id }))), exp:`${s.name}: ${s.desc}`, signId:s.id, grid:true };
  });
}
function detectiveQs(bank){
  return shuffle(BANKS[bank]).slice(0, 8).map(x => ({
    q:x.q, visual:`<div class="scene-emoji">${x.s}</div>`, exp:x.exp,
    opts:[ { html:'👍 Está certo', text:'Está certo', ok:x.ok }, { html:'👎 Está errado', text:'Está errado', ok:!x.ok } ], pre:'Detetive, isto está certo ou errado?'
  }));
}
function examQs(){
  const sq = signQuestions(SIGNS, 4);
  return shuffle([ ...sq, ...prepBank('car', 2), ...prepBank('prioridades', 2), ...detectiveQs('condutores').slice(0,2) ]);
}

/* ---------- Quiz genérico (inclui detetive e estrada) ---------- */
function gameQuiz(ctx, qs, mode={}){
  const { L, g } = ctx; let i = 0, right = 0;
  const show = () => {
    if (i >= qs.length) return finish(ctx, right / qs.length);
    const q = qs[i];
    const roadHTML = mode.road ? `<div class="roadscene" id="rs"><div class="asphalt"></div><div class="lane"></div><span class="tree">🌳</span><span class="tree" style="animation-delay:-1.2s">🌲</span>
        ${q.sign ? `<div class="rsign">${signSVG(q.sign, 86)}<div class="pole"></div></div>` : `<div class="rsign" style="font-size:52px;background:#fff;border-radius:18px;padding:4px 8px">${(q.visual.match(/scene-emoji">([^<]*)/)||[])[1]||'❓'}</div>`}
        <span class="veh" id="veh">${mode.road}</span></div>` : '';
    const cols = q.grid || (q.vis && q.opts.length >= 3) ? 'g3' : (q.vis ? 'g2' : '');
    render(`${hud(L, i, qs.length)}
      ${roadHTML}
      <div class="qcard">
        ${mode.road ? '' : q.visual}
        <div class="row" style="align-items:flex-start"><div class="qtext grow">${q.pre ? `<div class="muted" style="font-size:15px">${q.pre}</div>` : ''}${esc(q.q)}</div><button class="sayb" id="say">🔊</button></div>
        <div class="opts ${cols ? 'grid '+cols : ''}">${q.opts.map((o,k) => `<button class="opt ${q.vis?'vis':''}" data-k="${k}" data-silent="1">${o.html}</button>`).join('')}</div>
        <div id="fb"></div>
      </div>`);
    bindQuit(L);
    const speakQ = () => Voice.say((q.pre ? q.pre + ' ' : '') + q.q + (q.vis ? '' : ' ' + q.opts.map(o => o.text).filter(Boolean).join('? Ou ') + '?'));
    $('#say').onclick = speakQ;
    if (mode.road){ Sound.play(mode.road === '🚲' ? 'bell' : 'engine'); later(speakQ, 900); } else later(speakQ, 250);
    let answered = false;
    $$('.opt').forEach(b => b.onclick = () => {
      if (answered) return; answered = true;
      const o = q.opts[+b.dataset.k];
      $$('.opt').forEach((x,k) => { if (q.opts[k].ok) x.classList.add('ok'); else if (x !== b) x.classList.add('dim'); });
      if (o.ok){ right++; Sound.play('correct'); b.classList.add('bounce'); }
      else { b.classList.add('no','shake'); Sound.play('wrong'); }
      if (q.signId) stat(q.signId, o.ok);
      const praise = pick(['Muito bem!','Boa!','Fantástico!','Isso mesmo!','Excelente!']);
      const fbtext = o.ok ? `${praise} ${q.exp}` : `Quase! ${q.exp}`;
      $('#fb').innerHTML = `<div class="feedback ${o.ok?'ok':'no'}">${o.ok?'✅':'💡'} ${esc(fbtext)}</div><button class="btn big" id="next" style="width:100%;margin-top:12px">Continuar ➜</button>`;
      Voice.say(fbtext);
      if (mode.road && o.ok){ later(() => { const v = $('#veh'); if (v){ v.classList.add('go'); Sound.play(mode.road === '🚲' ? 'bell' : 'engine'); } }, 300); }
      if (mode.road && !o.ok){ $('#rs') && $('#rs').classList.add('stop'); Sound.play('horn'); }
      $('#next').onclick = () => { i++; show(); };
      $('#next').scrollIntoView({ behavior:'smooth', block:'nearest' });
    });
  };
  show();
}

  const { L } = ctx; const p = P(); const GOAL = 5;
  let phase = 'red', looked = false, crossing = false, success = 0, mistakes = 0;
  render(`${hud(L, 0, GOAL)}

    </div>`);
  bindQuit(L);
  later(() => Voice.say('Semáforo mágico! Espera pelo boneco verde. Primeiro carrega em olhar, depois em atravessar.'), 200);
  const msg = (t, ok=true) => { const m = $('#msg'); if (!m) return; m.className = 'feedback ' + (ok?'ok':'no'); m.textContent = t; };
  const setLight = () => {
    const r = $('#lr'), gg = $('#lg'); if (!r) return;
    r.classList.toggle('on', phase === 'red');
    gg.classList.toggle('on', phase !== 'red'); gg.classList.toggle('blink', phase === 'blink');
  };
  const spawnCar = () => {
    const box = $('#cars'); if (!box) return;
    const c = document.createElement('div'); c.className = 'car' + (Math.random() < .5 ? ' b' : '');
    c.textContent = pick(['🚗','🚙','🚌','🚕','🚚','🏍️']); box.appendChild(c);
    Sound.play('carPass'); setTimeout(() => c.remove(), 1800);
  };
  const cycle = () => {
    phase = 'red'; setLight();
    later(spawnCar, 300); later(spawnCar, 1500); later(spawnCar, 2700);
    later(() => { phase = 'green'; setLight(); Sound.play('pedBeep');
      for (let k=1;k<9;k++) later(() => { if (phase !== 'red') Sound.play('pedBeep'); }, k*450); }, 4600);
    later(() => { phase = 'blink'; setLight(); }, 8600);
    later(cycle, 10200);
  };
  cycle();
  $('#look').onclick = () => {
    if (crossing) return;
    const k = $('#kid'); k.classList.remove('look'); void k.offsetWidth; k.classList.add('look');
    looked = true; Voice.say('Esquerda, direita, esquerda!'); msg('👀 Olhaste para os dois lados. Muito bem!');

      msg('Espera! O boneco está vermelho. Os carros estão a passar.', false); Voice.say('Espera! O boneco está vermelho.'); return; }
    if (phase === 'blink'){ mistakes++; Sound.play('wrong'); msg('O verde está a piscar: não se começa a atravessar. Espera pelo próximo verde.', false); Voice.say('O verde está a piscar. Não comeces a atravessar.'); return; }
    if (!looked){ Sound.play('whistle'); msg('Antes de atravessar, olha para os dois lados! Carrega em 👀', false); Voice.say('Primeiro olha para os dois lados!'); return; }
    crossing = true; const k = $('#kid'); k.classList.add('up'); Sound.play('correct');
    msg('Boa! A atravessar na passadeira com o boneco verde. 🎉');
    later(() => {
      success++; looked = false; crossing = false;
      const kk = $('#kid'); if (kk){ kk.style.transition = 'none'; kk.classList.remove('up'); void kk.offsetWidth; kk.style.transition = ''; }
      const pr = $('.hud .progress i'); if (pr) pr.style.width = (success/GOAL*100)+'%';
      const b = $('.hud b'); if (b) b.textContent = `${success}/${GOAL}`;
      Sound.play('star');
      if (success >= GOAL) finish(ctx, mistakes === 0 ? 1 : mistakes <= 2 ? 0.7 : 0.4);
      else { msg(`Chegaste ao outro lado! Faltam ${GOAL-success}. Espera pelo próximo verde.`); Voice.say(`Muito bem! Faltam ${GOAL-success}.`); }
    }, 1800);
  };
}

/* ---------- Jogo da memória ---------- */
function gameMemory(ctx){
  const { L, g } = ctx;
  const pool = SIGNS.filter(s => s.lvl <= g.pool);
  const chosen = weightedSigns(pool, Math.min(g.pairs, pool.length));
  const cards = shuffle(chosen.flatMap(s => [ { sid:s.id, kind:'sign' }, { sid:s.id, kind:'name' } ]));
  let open = [], moves = 0, found = 0, lock = false;
  const cols = cards.length <= 8 ? 4 : cards.length <= 12 ? 4 : 4;
  render(`${hud(L, 0, chosen.length, '<span class="pill" id="mv">👆 0</span>')}
    <div class="qcard" style="padding:12px"><div class="row" style="margin-bottom:10px"><div class="qtext grow" style="font-size:18px">Encontra cada sinal e o seu nome!</div><button class="sayb" id="say">🔊</button></div>
    <div class="mem" style="grid-template-columns:repeat(${cols},1fr)">${cards.map((c,k) => `<button class="mcard" data-k="${k}" data-silent="1"><div class="in"><div class="f">❓</div><div class="b">${c.kind==='sign' ? signSVG(c.sid, 64) : esc(SIGN[c.sid].name)}</div></div></button>`).join('')}</div></div>`);
  bindQuit(L);
  $('#say').onclick = () => Voice.say('Vira as cartas e encontra cada sinal e o seu nome.');
  later(() => Voice.say('Jogo da memória! Encontra cada sinal e o seu nome.'), 200);
  $$('.mcard').forEach(b => b.onclick = () => {
    const k = +b.dataset.k; if (lock || b.classList.contains('open') || b.classList.contains('done')) return;
    b.classList.add('open'); Sound.play('flip'); open.push(k);
    if (open.length === 2){
      moves++; $('#mv').textContent = '👆 ' + moves; lock = true;
      const [a, c] = open.map(x => cards[x]); const els = open.map(x => $(`.mcard[data-k="${x}"]`));
      if (a.sid === c.sid && a.kind !== c.kind){
        later(() => { els.forEach(e => { e.classList.remove('open'); e.classList.add('done'); }); Sound.play('correct'); stat(a.sid, true);
          found++; Voice.say(SIGN[a.sid].name); const pr = $('.hud .progress i'); pr.style.width = (found/chosen.length*100)+'%'; $('.hud b').textContent = `${found}/${chosen.length}`;
          open = []; lock = false;
          if (found === chosen.length) later(() => finish(ctx, moves <= chosen.length + 2 ? 1 : moves <= chosen.length*2 ? 0.7 : 0.4), 900);
        }, 450);
      } else {
        later(() => { Sound.play('wrong'); }, 450);
        later(() => { els.forEach(e => e.classList.remove('open')); open = []; lock = false; }, 1100);
      }
    }
  });
}

/* ---------- Constrói o sinal ---------- */
const SHAPES = [ ['tri','Triângulo'], ['triDown','Triângulo ao contrário'], ['circle','Círculo'], ['oct','Octógono'], ['square','Quadrado'], ['diamond','Losango'] ];
const LOOKS = ['perigo','temp','proib','proibAzul','sentido','obrig','prior'];
const lookOf = sch => SCHEMES[sch].look;
function gameBuild(ctx){
  const { L, g } = ctx; const targets = shuffle(g.targets).slice(0, 4);
  let ti = 0, errors = 0, steps = 0;
  const round = () => {
    if (ti >= targets.length) return finish(ctx, errors === 0 ? 1 : errors <= Math.ceil(steps*0.25) ? 0.7 : 0.4);
    const s = SIGN[targets[ti]]; let shape = null, scheme = null;
    const hasSym = !!s.sym;
    const stepUI = (n, title, opts, onPick) => {
      render(`${hud(L, ti, targets.length)}
        <div class="qcard center">
          <div class="muted" style="font-weight:800">CONSTRÓI O SINAL</div>
          <h2 style="margin:4px 0">«${esc(s.name)}»</h2>
          <div class="steps">${[1,2,3].slice(0, hasSym?3:2).map(k => `<i class="${k<=n?'on':''}"></i>`).join('')}</div>
          <div class="signbox" id="pv">${shape ? drawShape(shape, scheme || 'blank', null, 110) : '<div style="width:110px;height:110px;border:4px dashed #c3d3dc;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px">❔</div>'}</div>
          <div class="row" style="justify-content:center"><div class="qtext">${title}</div><button class="sayb" id="say">🔊</button></div>
          <div class="opts grid g3">${opts.map((o,k) => `<button class="opt vis" data-k="${k}" data-silent="1">${o.html}<span style="font-size:13px">${esc(o.label||'')}</span></button>`).join('')}</div>
          <div id="fb"></div>
        </div>`);
      bindQuit(L);
      $('#say').onclick = () => Voice.say(`${title} Sinal: ${s.name}.`);
      later(() => Voice.say(`${title}`), 200);
      let done = false;
      $$('.opt').forEach(b => b.onclick = () => {
        if (done) return; const o = opts[+b.dataset.k]; steps++;
        if (o.ok){ done = true; b.classList.add('ok','bounce'); Sound.play('correct'); later(() => onPick(o), 650); }
        else { errors++; b.classList.add('no','shake'); Sound.play('wrong'); setTimeout(() => b.classList.remove('shake'), 400);
          $('#fb').innerHTML = `<div class="feedback no">💡 ${esc(o.hint || 'Tenta outra vez!')}</div>`; Voice.say(o.hint || 'Tenta outra vez!'); }
      });
    };
    const shapeOpts = shuffle([ SHAPES.find(x => x[0] === s.shape), ...shuffle(SHAPES.filter(x => x[0] !== s.shape)).slice(0,2) ])
      .map(([k, lab]) => ({ html:drawShape(k, 'blank', null, 70), label:lab, ok:k === s.shape, key:k, hint:`Não é essa forma. Pensa: os sinais de ${CATS[s.cat].name.toLowerCase()} têm que forma?` }));
    stepUI(1, 'Que forma tem este sinal?', shapeOpts, o => {
      shape = o.key;
      const correctLook = lookOf(s.scheme);
      const cand = shuffle(LOOKS.filter(x => lookOf(x) !== correctLook)).filter((x,i,a) => a.findIndex(y => lookOf(y) === lookOf(x)) === i).slice(0, 2);
      const schemeOpts = shuffle([ s.scheme, ...cand ]).map(k => ({ html:drawShape(shape, k, null, 70), label:lookOf(k), ok:lookOf(k) === correctLook, key:k, hint:'Essas não são as cores certas. Olha bem para os sinais à tua volta!' }));
      stepUI(2, 'De que cores é?', schemeOpts, o2 => {
        scheme = s.scheme;
        const fin = () => { ti++; Sound.play('pop'); stat(s.id, true);
          const close = modal(`<div class="center"><div class="signbox">${signSVG(s.id, 150)}</div><h2>${esc(s.name)}</h2><p style="font-weight:700">${esc(s.desc)}</p><button class="btn big" id="mc" style="width:100%">Continuar ➜</button></div>`, (m, cl) => { $('#mc', m).onclick = () => { cl(); round(); }; });
          Voice.say(`Construíste o sinal ${s.name}! ${s.desc}`); };
        if (!hasSym) return fin();
        const syms = Object.keys(SYM).filter(k => k !== s.sym && !['h7','stop','barra'].includes(k));
        const symOpts = shuffle([ s.sym, ...shuffle(syms).slice(0,2) ]).map(k => ({ html:drawShape(shape, scheme, k, 70), label:SYM_NAMES[k], ok:k === s.sym, hint:`Não é esse desenho. O sinal é «${s.name}».` }));
        stepUI(3, 'Que desenho leva?', symOpts, fin);
      });
    });
  };
  round();
}

/* ---------- Desafio relâmpago ---------- */
function gameFlash(ctx){
  const { L, g } = ctx; const pool = SIGNS.filter(s => s.lvl <= g.pool);
  const targets = weightedSigns(pool, Math.min(g.rounds, pool.length));
  let i = 0, right = 0;
  const round = () => {
    if (i >= targets.length) return finish(ctx, right / targets.length);
    const s = targets[i]; const opts = shuffle([ s, ...shuffle(pool.filter(o => o.id !== s.id)).slice(0, 3) ]);
    render(`${hud(L, i, targets.length, `<span class="pill">✅ ${right}</span>`)}
      <div class="qcard">
        <div class="timer"><i id="tm"></i></div>
        <div class="qtext center" style="margin:14px 0 4px">⚡ ${esc(s.find)}</div>
        <div class="opts grid g2">${opts.map((o,k) => `<button class="opt vis" data-k="${k}" data-silent="1">${signSVG(o.id, 92)}</button>`).join('')}</div>
        <div id="fb"></div>
      </div>`);
    bindQuit(L); Voice.say(s.find);
    const tm = $('#tm'); tm.style.transition = 'none'; tm.style.transform = 'scaleX(1)';
    requestAnimationFrame(() => requestAnimationFrame(() => { tm.style.transition = `transform ${g.time}s linear`; tm.style.transform = 'scaleX(0)'; }));
    let done = false; const t0 = Date.now();
    const tickT = every(() => { const left = g.time - (Date.now()-t0)/1000; if (!done && left < 3.2 && left > 0) Sound.play('tick'); }, 1000);
    const end = (ok, b) => {
      if (done) return; done = true; clearInterval(tickT); tm.style.transition = 'none';
      $$('.opt').forEach((x,k) => { if (opts[k].id === s.id) x.classList.add('ok'); else if (x !== b) x.classList.add('dim'); });
      stat(s.id, ok);
      if (ok){ right++; Sound.play('coin'); } else { b && b.classList.add('no'); Sound.play('wrong'); $('#fb').innerHTML = `<div class="feedback no">💡 Era este: ${esc(s.name)}</div>`; Voice.say(`Era o sinal ${s.name}.`); }
      later(() => { i++; round(); }, ok ? 800 : 2200);
    };
    later(() => end(false, null), g.time * 1000);
    $$('.opt').forEach(b => b.onclick = () => end(opts[+b.dataset.k].id === s.id, b));
  };
  render(`${hud(L,0,targets.length)}<div class="qcard center"><div style="font-size:90px" class="bounce">⚡</div><h2>Prepara-te!</h2><p class="muted" style="font-weight:700">Encontra o sinal certo antes do tempo acabar.</p></div>`);
  bindQuit(L);
  // re-adicionar timers após render (render limpa os timers)
  later(() => Voice.say('Desafio relâmpago! Encontra o sinal antes do tempo acabar.'), 100);
  later(round, 2000);
}

/* ---------- Fim de jogo: estrelas, moedas, cromos ---------- */
function finish(ctx, ratio){
  const { L, g } = ctx; const p = P();
  const stars = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : 1;
  const wasDone = levelDone(p, L); const nextL = LEVELS[L.n]; const nextWasOpen = nextL ? levelUnlocked(p, nextL) : true; const prev = gameStars(p, g.id);
  p.progress[g.id] = Math.max(prev, stars);
  const coins = stars * 5; p.coins += coins; p.plays++;
  let newSticker = null;
  if (stars >= 2){ const free = STICKERS.filter(s => !p.stickers.includes(s[0])); if (free.length){ newSticker = pick(free); p.stickers.push(newSticker[0]); } }
  const levelNowDone = !wasDone && levelDone(p, L);
  if (levelNowDone && !p.diplomas.includes(L.n)) p.diplomas.push(L.n);
  save();
  const msgs = { 3:'Fantástico! És um craque da estrada!', 2:'Muito bem! Estás quase a ser um mestre!', 1:'Bom trabalho! Treina outra vez para ganhar mais estrelas!' };
  render(`<div class="qcard center" style="margin-top:20px">
      <div style="font-size:70px">${stars===3?'🏆':stars===2?'🎉':'👍'}</div>
      <h1>${msgs[stars]}</h1>
      <div class="bigstars">${[1,2,3].map(k => `<span class="${k<=stars?'on':''}" style="animation-delay:${k*.35}s">★</span>`).join('')}</div>
      <p style="font-size:20px;font-weight:800">🪙 +${coins} moedas</p>
      ${newSticker ? `<div class="card" style="background:var(--teal-l);margin:10px 0"><div class="muted" style="font-weight:800">NOVO CROMO!</div><div class="reveal">${newSticker[0]}</div><b>${newSticker[1]}</b></div>` : ''}
      <div class="grid g2" style="margin-top:14px"><button class="btn ghost big" id="again">🔁 Outra vez</button><button class="btn big" id="cont">Continuar ➜</button></div>
    </div>`);
  [1,2,3].forEach(k => { if (k <= stars) later(() => Sound.play('star'), k*350); });
  later(() => Sound.play('coin'), 1300);
  if (newSticker) later(() => Sound.play('pop'), 1700);
  if (stars === 3){ later(confetti, 400); later(() => Sound.play('win'), 1900); }
  later(() => Voice.say(msgs[stars] + (newSticker ? ` Ganhaste o cromo ${newSticker[1]}!` : '')), 600);
  $('#again').onclick = () => startGame(L, g);
  $('#cont').onclick = () => { if (levelNowDone) showDiploma(L, true, !nextWasOpen); else screenLevel(L); };
}
function showDiploma(L, fresh, newUnlock){
  const p = P(); screenLevel(L);
  if (fresh){ Sound.play('levelUp'); confetti(); later(() => Sound.play('win'), 900); }
  const next = LEVELS[L.n];
  modal(`<div class="diploma">

      <div style="padding:12px 0;font-weight:800">🔉 Volume <input type="range" id="vol" min="0" max="1" step="0.05" value="${st.volume}"></div>
      <button class="btn sun" id="test" style="width:100%">▶️ Testar sons e voz</button>
      ${!voiceOk ? '<div class="voicewarn">Este navegador não tem voz. Os efeitos sonoros continuam a funcionar.</div>' : (Voice.langFound && /pt[-_]PT/i.test(Voice.langFound) ? `<p class="muted" style="font-size:14px;font-weight:700">Voz encontrada: ${esc(Voice.voice.name)} (${Voice.langFound})</p>` : `<div class="voicewarn">Não foi encontrada uma voz em português de Portugal neste aparelho${Voice.langFound ? ' (a usar ' + esc(Voice.langFound) + ')' : ''}. Podes instalá-la nas definições de voz/texto‑para‑fala do telemóvel.</div>`)}
      <p class="muted" style="font-size:13px;font-weight:700">No iPhone, se não ouvires nada, verifica se o botão de silêncio está desligado e o volume está alto.</p>
    </div>
    <button class="btn ghost" id="sw" style="width:100%;margin-top:14px">👥 Mudar de perfil</button>`);
  $('#back').onclick = () => P() ? screenHome() : screenProfiles();
  $('#sw').onclick = screenProfiles;
  $$('[data-t]').forEach(b => b.onclick = () => {
    const k = b.dataset.t; st[k] = !st[k]; save(); b.classList.toggle('on', st[k]);
    if (k === 'music'){ st.music ? (Sound.unlock(), Sound.startMusic()) : Sound.stopMusic(); }
    if (k === 'voice' && st.voice) Voice.say('Voz ligada!');
    if (k === 'sound' && st.sound) Sound.play('correct');
  });
  $('#vol').oninput = e => Sound.setVolume(+e.target.value);
  $('#vol').onchange = () => { save(); Sound.play('coin'); };
  $('#test').onclick = testSounds;
}
function screenParentsGate(){
  const a = 3 + Math.floor(Math.random()*7), b = 4 + Math.floor(Math.random()*6);
  currentTab = 'parents';
  render(`${topBar()}<div class="card center" style="margin-top:10px">
    <div style="font-size:60px">👪</div><h2>Área dos pais</h2><p class="muted" style="font-weight:700">Para entrar, responde: quanto é <b>${a} × ${b}</b>?</p>
    <input type="text" id="ans" inputmode="numeric" placeholder="Resposta" style="text-align:center">
    <button class="btn big navy" id="go" style="width:100%;margin-top:12px">Entrar</button></div>`, { nav:true });
  bindTop();
  $('#go').onclick = () => { if (+$('#ans').value === a*b) screenParents(); else { Sound.play('wrong'); $('#ans').classList.add('shake'); setTimeout(() => $('#ans').classList.remove('shake'), 400); } };
}
function screenParents(){
  const p = P();
  const stats = SIGNS.map(s => ({ s, st:p.signStats[s.id] || {ok:0, err:0} })).filter(x => x.st.ok + x.st.err > 0);
  const hard = stats.filter(x => x.st.err > 0).sort((a,b) => (b.st.err/(b.st.ok+b.st.err)) - (a.st.err/(a.st.ok+a.st.err)) || b.st.err - a.st.err).slice(0,6);
  const totOk = stats.reduce((a,x)=>a+x.st.ok,0), totErr = stats.reduce((a,x)=>a+x.st.err,0);
  render(`<div class="topbar"><button class="iconbtn" id="back">⬅️</button><h2>👪 Painel parental</h2></div>
    <div class="card"><div class="row">${avatarHTML(p,'lg')}<div><h2 style="margin:0">${esc(p.name)}</h2><div class="muted" style="font-weight:700">Idade: ${AGES[p.ageLvl-1][0]} · ${p.plays} jogos · desde ${new Date(p.created).toLocaleDateString('pt-PT')}</div>
      <div class="row wrap" style="margin-top:6px"><span class="pill">⭐ ${totalStars(p)}</span><span class="pill">🪙 ${p.coins}</span><span class="pill">🃏 ${p.stickers.length}</span><span class="pill">🎓 ${p.diplomas.length}</span></div></div></div></div>
    <div class="card" style="margin-top:14px"><h3>Progresso por nível</h3>
      ${LEVELS.map(L => { const st = levelStars(p,L), max = L.games.length*3; return `<div class="bar-row"><span style="width:150px">${L.icon} ${L.name}</span><div class="progress"><i style="width:${st/max*100}%;background:${L.color}"></i></div><span>${st}/${max}</span></div>`; }).join('')}</div>
    <div class="card" style="margin-top:14px"><h3>Sinais reconhecidos</h3>
      <p class="muted" style="font-weight:700;margin-top:0">Respostas sobre sinais: ✅ ${totOk} certas · 💡 ${totErr} a rever${totOk+totErr ? ` (${Math.round(totOk/(totOk+totErr)*100)}% de acerto)` : ''}</p>
      <h3>Sinais a treinar</h3>
      ${hard.length ? `<div class="grid g3">${hard.map(x => `<div class="libitem">${signSVG(x.s.id,60)}<span>${esc(x.s.name)}</span><span class="muted">${x.st.err} erro(s)</span></div>`).join('')}</div><p class="muted" style="font-size:14px;font-weight:700">O jogo mostra estes sinais mais vezes (aprendizagem adaptativa).</p>` : '<p class="muted" style="font-weight:700">Ainda sem dados suficientes. 👍</p>'}</div>
    <div class="card" style="margin-top:14px"><h3>Opções</h3>
      <div class="switch">🔓 Desbloquear todos os níveis <button class="tog ${p.unlockAll?'on':''}" id="ua"></button></div>
      <div style="padding:10px 0;font-weight:800">🎂 Idade do perfil</div>
      <div class="grid g3" id="ages">${AGES.map(([t,l]) => `<button class="choice ${p.ageLvl===l?'sel':''}" data-g="${l}" style="font-size:15px;font-weight:800">${t}</button>`).join('')}</div>
      <div class="grid g2" style="margin-top:14px"><button class="btn ghost small" id="rst">🔄 Recomeçar progresso</button><button class="btn coral small" id="del">🗑️ Apagar perfil</button></div>
      <p class="muted" style="font-size:13px;font-weight:700">Os perfis ficam guardados neste aparelho e neste navegador.</p></div>
    <div class="card" style="margin-top:14px;font-size:14px"><h3>Sobre os conteúdos</h3><p class="muted" style="font-weight:600;margin:0">Baseado no Código da Estrada e no Regulamento de Sinalização do Trânsito (RST) em vigor em Portugal, e nas recomendações da ANSR. Os desenhos dos sinais são versões simplificadas para crianças.</p></div>`);
  $('#back').onclick = screenHome;
  $('#ua').onclick = e => { p.unlockAll = !p.unlockAll; save(); e.target.classList.toggle('on', p.unlockAll); };
  $$('#ages .choice').forEach(b => b.onclick = () => { p.ageLvl = +b.dataset.g; save(); $$('#ages .choice').forEach(x => x.classList.toggle('sel', x === b)); });
  $('#rst').onclick = () => modal(`<h2>Recomeçar o progresso de ${esc(p.name)}?</h2><p>Estrelas, moedas, cromos e diplomas voltam ao início.</p><div class="grid g2"><button class="btn ghost" id="n">Cancelar</button><button class="btn coral" id="y">Recomeçar</button></div>`, (m, cl) => {
    $('#n', m).onclick = cl; $('#y', m).onclick = () => { Object.assign(p, { coins:10, stickers:[], vehicles:['🚲'], vehicle:'🚲', progress:{}, signStats:{}, diplomas:[], plays:0 }); save(); cl(); screenParents(); toast('Progresso reiniciado'); }; });
  $('#del').onclick = () => modal(`<h2>Apagar o perfil de ${esc(p.name)}?</h2><p>Esta ação não pode ser desfeita.</p><div class="grid g2"><button class="btn ghost" id="n">Cancelar</button><button class="btn coral" id="y">Apagar</button></div>`, (m, cl) => {
    $('#n', m).onclick = cl; $('#y', m).onclick = () => { S.profiles = S.profiles.filter(x => x.id !== p.id); S.current = null; save(); cl(); screenProfiles(); }; });
}

/* ---------- Arranque ---------- */
window.__MC = { SFX, Sound, Voice, SIGNS, BANKS, LEVELS, S, signSVG };
if (S.settings.music) { /* música só começa após o primeiro toque */ }
P() ? screenHome() : screenProfiles();
</script>
</body>
</html>
